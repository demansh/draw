<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111111" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>Упражнения для рисования</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="app-header">
      <h1 class="app-title">✏️ Упражнения для рисования</h1>
      <p class="app-subtitle" id="video-count"></p>
      <nav class="filter-tabs" id="filter-tabs" aria-label="Тип видео">
        <button class="filter-tab" type="button" data-filter="all" aria-pressed="true">
          Все<span class="filter-tab-count"></span>
        </button>
        <button class="filter-tab" type="button" data-filter="shorts" aria-pressed="false">
          Shorts<span class="filter-tab-count"></span>
        </button>
        <button class="filter-tab" type="button" data-filter="videos" aria-pressed="false">
          Видео<span class="filter-tab-count"></span>
        </button>
      </nav>
    </header>

    <main class="feed" id="feed" aria-live="polite"></main>

    <div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="Просмотр видео" hidden>
      <div class="viewer-bar">
        <span class="viewer-counter"></span>
        <div class="viewer-bar-actions">
          <a class="viewer-link" target="_blank" rel="noopener noreferrer">YouTube ↗</a>
          <button class="viewer-button viewer-button-round" type="button" data-action="close" aria-label="Закрыть">
            ✕
          </button>
        </div>
      </div>
      <div class="viewer-stage-area">
        <div class="viewer-stage">
          <div id="viewer-player"></div>
        </div>
        <p class="viewer-error" role="alert" hidden></p>
      </div>
      <div class="viewer-bar viewer-bar-bottom">
        <button class="viewer-button" type="button" data-action="previous">↑ Назад</button>
        <button class="viewer-button" type="button" data-action="next">Дальше ↓</button>
      </div>
    </div>

    <template id="video-card-template">
      <article class="video-card">
        <div class="video-frame">
          <button class="video-preview" type="button">
            <img class="video-thumbnail" alt="" loading="lazy" decoding="async" />
            <span class="play-icon" aria-hidden="true"></span>
          </button>
        </div>
        <footer class="video-meta">
          <span class="video-label"></span>
          <div class="video-actions">
            <button class="video-expand" type="button">⛶ На весь экран</button>
            <a class="video-link" target="_blank" rel="noopener noreferrer">YouTube ↗</a>
          </div>
        </footer>
      </article>
    </template>

    <script src="videos.js"></script>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
